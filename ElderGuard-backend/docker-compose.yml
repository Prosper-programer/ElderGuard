services:
  mysql:
    image: mysql:8.4
    container_name: elderguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-elderguard}
      MYSQL_USER: ${DB_USER:-elderguard}
      MYSQL_PASSWORD: ${DB_PASSWORD:-elderguard_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    build:
      context: .
      target: production
    container_name: elderguard-db-init
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-elderguard}
      DB_USER: ${DB_USER:-elderguard}
      DB_PASSWORD: ${DB_PASSWORD:-elderguard_dev_password}
    command: ["node", "-e", "require('./dist/config/initDatabase.js').initializeDatabase().then(() => process.exit(0)).catch(() => process.exit(1))"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      target: production
    container_name: elderguard-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-elderguard}
      DB_USER: ${DB_USER:-elderguard}
      DB_PASSWORD: ${DB_PASSWORD:-elderguard_dev_password}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  mysql_data:
